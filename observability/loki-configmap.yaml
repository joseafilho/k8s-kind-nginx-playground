apiVersion: v1
kind: ConfigMap
metadata:
  name: loki-config
  namespace: logging
data:
  loki.yaml: |
    auth_enabled: false
    
    server:
      http_listen_port: 3100
      grpc_listen_port: 9096
    
    common:
      path_prefix: /var/loki
      storage:
        filesystem:
          chunks_directory: /var/loki/chunks
          rules_directory: /var/loki/rules
      replication_factor: 1
      ring:
        kvstore:
          store: inmemory
    
    schema_config:
      configs:
        - from: "2024-01-01"
          store: tsdb
          object_store: filesystem
          schema: v13
          index:
            prefix: loki_index_
            period: 24h
    
    ruler:
      alertmanager_url: http://localhost:9093
    
    limits_config:
      enforce_metric_name: false
      reject_old_samples: true
      reject_old_samples_max_age: 168h
      max_cache_freshness_per_query: 10m
      split_queries_by_interval: 15m
      max_query_parallelism: 32
      max_streams_per_user: 0
      max_global_streams_per_user: 0
      max_query_length: 721h
      max_query_parallelism: 32
      cardinality_limit: 100000
      max_streams_matchers_per_query: 1000
      max_entries_limit_per_query: 5000
    
    ingester:
      lifecycler:
        ring:
          kvstore:
            store: inmemory
          replication_factor: 1
        final_sleep: 0s
      chunk_idle_period: 5m
      chunk_retain_period: 30s
      max_chunk_age: 1h
      chunk_target_size: 1048576
      chunk_encoding: snappy
      max_stale_chunk_idle_time: 2m
      max_transfer_retries: 0
      wal:
        dir: /var/loki/wal
        replay_memory_ceiling: 2GB
        replay_ceiling: 4GB
        max_read_operations: 1000
        max_write_operations: 1000
        max_operations_per_second: 100
    
    storage_config:
      filesystem:
        chunks_directory: /var/loki/chunks
        rules_directory: /var/loki/rules
      table_manager:
        retention_deletes_enabled: true
        retention_period: 744h
        retention_delete_delay: 2h
        retention_delete_worker_count: 150
        retention_delete_batch_size: 1000
        retention_delete_max_retries: 10
        retention_delete_retry_delay: 1s
    
    compactor:
      working_directory: /var/loki/compactor
      shared_store: filesystem
      compaction_interval: 10m
      retention_enabled: true
      retention_delete_delay: 2h
      retention_delete_worker_count: 150
      retention_delete_batch_size: 1000
      retention_delete_max_retries: 10
      retention_delete_retry_delay: 1s
      max_compaction_parallelism: 1
      compaction_retention_enabled: true
    
    query_range:
      results_cache:
        cache:
          embedded_cache:
            enabled: true
            max_size_mb: 100
      max_retries: 5
      split_queries_by_interval: 15m
      cache_results: true
      parallelise_shardable_queries: true
    
    frontend:
      compress_responses: true
      log_queries_longer_than: 5s
      downstream_url: http://localhost:3100
      max_outstanding_requests_per_tenant: 2048
      max_retries: 5
      compress_responses: true
      log_queries_longer_than: 5s
      downstream_url: http://localhost:3100
      max_outstanding_requests_per_tenant: 2048
      max_retries: 5
